services:
  kafka:
    image: bitnamilegacy/kafka:3.7.1
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093,2@kafka-2:9093,3@kafka-3:9093
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes
    ports: ["9092:9092"]

  kafka-2:
    image: bitnamilegacy/kafka:3.7.1
    environment:
      - KAFKA_CFG_NODE_ID=2
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-2:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093,2@kafka-2:9093,3@kafka-3:9093
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes
    ports: ["9094:9092"]

  kafka-3:
    image: bitnamilegacy/kafka:3.7.1
    environment:
      - KAFKA_CFG_NODE_ID=3
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-3:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093,2@kafka-2:9093,3@kafka-3:9093
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes
    ports: ["9095:9092"]

  kafka-connect:
    image: debezium/connect:2.7.1.Final
    depends_on: [kafka]
    ports: ["8085:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:9092,kafka-2:9092,kafka-3:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      VALUE_CONVERTER_SCHEMAS_ENABLE: "true"
      ENABLE_DEBEZIUM_SCRIPTING: "false"

  postgres-loan:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical"]
    environment: { POSTGRES_DB: loan_db, POSTGRES_USER: loan, POSTGRES_PASSWORD: loan }
    ports: ["5433:5432"]

  postgres-loan-2:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical"]
    environment: { POSTGRES_DB: loan_db_2, POSTGRES_USER: loan2, POSTGRES_PASSWORD: loan2 }
    ports: ["5438:5432"]

  postgres-orchestrator:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical"]
    environment: { POSTGRES_DB: orchestrator_db, POSTGRES_USER: orchestrator, POSTGRES_PASSWORD: orchestrator }
    ports: ["5434:5432"]

  pgpool-kyc:
    image: bitnami/pgpool:4
    environment:
      - PGPOOL_BACKEND_NODES=0:postgres-kyc-0:5432,1:postgres-kyc-1:5432
      - PGPOOL_SR_CHECK_USER=customuser
      - PGPOOL_SR_CHECK_PASSWORD=custompassword
      - PGPOOL_ENABLE_LOAD_BALANCING=yes
      - PGPOOL_POSTGRES_USERNAME=kyc
      - PGPOOL_POSTGRES_PASSWORD=kyc
      - PGPOOL_ADMIN_USERNAME=admin
      - PGPOOL_ADMIN_PASSWORD=adminpassword
    ports:
      - "5435:5432"
    depends_on:
      - postgres-kyc-0
      - postgres-kyc-1

  postgres-kyc-0:
    image: bitnami/postgresql-repmgr:16
    environment:
      - POSTGRESQL_POSTGRES_PASSWORD=adminpassword
      - POSTGRESQL_USERNAME=kyc
      - POSTGRESQL_PASSWORD=kyc
      - POSTGRESQL_DATABASE=kyc_db
      - REPMGR_PASSWORD=repmgrpassword
      - REPMGR_PRIMARY_HOST=postgres-kyc-0
      - REPMGR_NODE_NETWORK_NAME=postgres-kyc-0
      - REPMGR_NODE_NAME=postgres-kyc-0
      - REPMGR_PARTNER_NODES=postgres-kyc-0,postgres-kyc-1
      - POSTGRESQL_WAL_LEVEL=logical

  postgres-kyc-1:
    image: bitnami/postgresql-repmgr:16
    environment:
      - POSTGRESQL_POSTGRES_PASSWORD=adminpassword
      - POSTGRESQL_USERNAME=kyc
      - POSTGRESQL_PASSWORD=kyc
      - POSTGRESQL_DATABASE=kyc_db
      - REPMGR_PASSWORD=repmgrpassword
      - REPMGR_PRIMARY_HOST=postgres-kyc-0
      - REPMGR_NODE_NETWORK_NAME=postgres-kyc-1
      - REPMGR_NODE_NAME=postgres-kyc-1
      - REPMGR_PARTNER_NODES=postgres-kyc-0,postgres-kyc-1
      - POSTGRESQL_WAL_LEVEL=logical

  postgres-credit:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical"]
    environment: { POSTGRES_DB: credit_db, POSTGRES_USER: credit, POSTGRES_PASSWORD: credit }
    ports: ["5436:5432"]

  postgres-disbursement:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical"]
    environment: { POSTGRES_DB: disbursement_db, POSTGRES_USER: disbursement, POSTGRES_PASSWORD: disbursement }
    ports: ["5437:5432"]

  loan-service:
    build: { context: ., dockerfile: loan-service/Dockerfile }
    depends_on: [kafka, postgres-loan, postgres-loan-2]
    ports: ["8081:8081"]

  loan-orchestrator-service:
    build: { context: ., dockerfile: loan-orchestrator-service/Dockerfile }
    depends_on: [kafka, postgres-orchestrator]
    ports: ["8080:8080"]

  kyc-service:
    build: { context: ., dockerfile: kyc-service/Dockerfile }
    depends_on: [kafka, pgpool-kyc]
    ports: ["8082:8082"]

  credit-service:
    build: { context: ., dockerfile: credit-service/Dockerfile }
    depends_on: [kafka, postgres-credit]
    ports: ["8083:8083"]

  disbursement-service:
    build: { context: ., dockerfile: disbursement-service/Dockerfile }
    depends_on: [kafka, postgres-disbursement]
    ports: ["8084:8084"]

  # KONG API GATEWAY (Cửa Khẩu Trung Ương)
  kong:
    image: kong:3.6.0-ubuntu
    environment:
      - KONG_DATABASE=off # Chạy chế độ DB-Less (Siêu nhẹ)
      - KONG_DECLARATIVE_CONFIG=/usr/local/kong/declarative/kong.yml
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_PROXY_LISTEN=0.0.0.0:8000
    ports:
      - "8000:8000" # Cổng MẶC ĐỊNH phơi ra ngoài cho Client (Postman / Mobile App) gọi vào
    volumes:
      - ./kong/kong.yml:/usr/local/kong/declarative/kong.yml
    depends_on:
      - loan-service

  # IN-MEMORY CACHE (Redis) - Chiến thần gánh tải cho Orchestrator Write-Behind Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      - kafka
      - kafka-2
      - kafka-3
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:9092,kafka-2:9092,kafka-3:9092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  # METRICS & ALERTING (Mắt thần & Hệ thống Hú còi)
  prometheus:
    image: prom/prometheus:v2.54.0
    restart: always
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    depends_on:
      - loan-orchestrator-service

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: always
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"

  # VISUALIZATION (Bảng điều khiển Giám đốc)
  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

  # 🚀 ELASTICSEARCH ENGINE (CHUYÊN CÂN READ-HEAVY)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.4
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  keycloak:
    image: quay.io/keycloak/keycloak:22.0.1
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    command: start-dev
    ports:
      - "8086:8080"

  # 🔍 DISTRIBUTED TRACING (Mắt thần Jaeger / Tempo)
  jaeger-collector:
    image: jaegertracing/all-in-one:1.50
    ports:
      - "16686:16686" # Web UI
      - "4318:4318"   # OTLP http receiver
