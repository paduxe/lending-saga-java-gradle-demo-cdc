# 1. HPA: Tự động scale dựa trên CPU/Memory (Hạn chế #14)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: all-services-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: loan-service # Áp dụng tương tự cho kyc, credit...
  minReplicas: 3
  maxReplicas: 50
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

---
# 2. PDB: Không bao giờ cho phép quá 1 Pod chết cùng lúc (Hạn chế #19)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: service-pdb
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      tier: backend
