apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: loan-orchestrator-hpa
  namespace: lending-saga
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: loan-orchestrator-service
  minReplicas: 2
  maxReplicas: 50
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Pods
    pods:
      metric:
        name: kafka_consumer_lag_saga_events
      target:
        type: AverageValue
        averageValue: 5000
