# K8s manifests cover TOÀN BỘ downstream services (KYC, Credit, Disbursement, Orchestrator)
# KYC SERVICE ===============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyc-service
  namespace: lending-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kyc-service
  template:
    metadata:
      labels:
        app: kyc-service
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector: { matchExpressions: [{key: app, operator: In, values: [kyc-service]}] }
            topologyKey: "kubernetes.io/hostname"
      containers:
      - name: kyc-service
        image: loan-kyc-service:latest
        ports: [{containerPort: 8082}]
        envFrom: [{configMapRef: {name: app-config}}, {secretRef: {name: app-secrets}}]
        livenessProbe: {httpGet: {path: /actuator/health/liveness, port: 8082}, initialDelaySeconds: 30, periodSeconds: 10}
        readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8082}, initialDelaySeconds: 30, periodSeconds: 10}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: kyc-service-hpa, namespace: lending-prod}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: kyc-service}
  minReplicas: 3
  maxReplicas: 30
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 75}}}]

