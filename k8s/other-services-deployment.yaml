apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyc-service
  namespace: lending-saga
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kyc-service
  template:
    metadata:
      labels:
        app: kyc-service
    spec:
      containers:
        - name: kyc-service
          image: lending-saga/kyc-service:latest
          ports:
            - containerPort: 8082
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
---
