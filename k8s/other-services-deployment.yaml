---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-orchestrator-service
  namespace: lending-saga
spec:
  replicas: 3
  selector:
    matchLabels:
      app: loan-orchestrator-service
  template:
    metadata:
      labels:
        app: loan-orchestrator-service
    spec:
      containers:
        - name: loan-orchestrator-service
          image: lending-saga/loan-orchestrator-service:latest
          ports:
            - containerPort: 8085
          env:
            - name: SPRING_DATA_REDIS_HOST
              value: "redis-service"
          resources:
            limits:
              memory: "1Gi"
              cpu: "1000m"
