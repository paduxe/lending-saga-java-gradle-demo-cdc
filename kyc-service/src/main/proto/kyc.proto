syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.example.lending.kyc.grpc";
option java_outer_classname = "KycProto";

package kyc;

service KycService {
  rpc CheckCustomer(KycRequest) returns (KycResponse) {}
}

message KycRequest {
  string customerId = 1;
}

message KycResponse {
  bool isBlocked = 1;
  string reason = 2;
  string status = 3;
}
