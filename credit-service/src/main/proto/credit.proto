syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.example.lending.credit.grpc";
option java_outer_classname = "CreditProto";

package credit;

service CreditService {
  rpc CheckCredit(CreditRequest) returns (CreditResponse) {}
}

message CreditRequest {
  string customerId = 1;
  double loanAmount = 2;
}

message CreditResponse {
  bool isQualified = 1;
  double availableLimit = 2;
  string reason = 3;
}
